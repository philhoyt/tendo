# Builds the theme and attaches a distributable zip to a GitHub release
# whenever a version tag is pushed. WordPress.org themes are submitted
# through the theme upload form, so the zip from the release is what you
# upload there.
#
# To cut a release: bump the version in style.css, readme.txt (Stable tag),
# and package.json, add a changelog entry, commit, then:
#   git tag 2.0.0 && git push origin 2.0.0
name: Release

on:
 push:
  tags:
   - "[0-9]+.[0-9]+.[0-9]+"

permissions:
 contents: write

jobs:
 release:
  name: Build and publish zip
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v7

   - uses: actions/setup-node@v7
     with:
      node-version: 24
      cache: npm

   - name: Check the tag matches the theme version
     run: |
      version=$(sed -n 's/^Version: *//p' style.css | tr -d '\r')
      if [ "$version" != "$GITHUB_REF_NAME" ]; then
        echo "style.css says $version but the tag is $GITHUB_REF_NAME"
        exit 1
      fi
      stable=$(sed -n 's/^Stable tag: *//p' readme.txt | tr -d '\r')
      if [ "$stable" != "$GITHUB_REF_NAME" ]; then
        echo "readme.txt Stable tag says $stable but the tag is $GITHUB_REF_NAME"
        exit 1
      fi

   - name: Install npm dependencies
     run: npm ci

   - name: Build
     run: npm run build

   - name: Create the theme zip
     # Stage a copy filtered by .distignore into a tendo/ folder and zip
     # that, so the archive extracts to a stable directory name.
     run: |
      stage="$RUNNER_TEMP/stage"
      mkdir -p "$stage/tendo"
      rsync -a --exclude-from=.distignore --exclude=.distignore ./ "$stage/tendo/"
      (cd "$stage" && zip -rq "$RUNNER_TEMP/tendo.zip" tendo)

   - name: List the zip contents
     run: unzip -l "$RUNNER_TEMP/tendo.zip"

   # The Theme Directory requires stylesheets to ship as readable source. A
   # minified file has no indented lines, however it is wrapped.
   - name: Check the stylesheets are not minified
     run: |
      for f in "$RUNNER_TEMP"/stage/tendo/dist/css/*.css; do
        n=$(grep -c '^[[:space:]]' "$f" || true)
        echo "$f: $n indented lines"
        if [ "$n" -lt 20 ]; then
          echo "::error::$f looks minified"; exit 1
        fi
      done

   - uses: softprops/action-gh-release@v3
     with:
      files: ${{ runner.temp }}/tendo.zip
      generate_release_notes: true
